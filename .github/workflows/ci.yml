name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 2.7 = SketchUp 2021–2023, 3.2 = SketchUp 2024+
        ruby: ['2.7', '3.2']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: gem install minitest rake --no-document
      - run: rake test
      - run: rake package
      - uses: actions/upload-artifact@v4
        if: matrix.ruby == '3.2'
        with:
          name: rbz
          path: dist/*.rbz
