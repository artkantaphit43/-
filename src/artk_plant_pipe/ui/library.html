<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Reference Library</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f7f9; --fg: #1d2330; --mut: #667085; --line: #e1e4ea;
    --acc: #1570ef; --acc-fg: #ffffff; --chip: #eef2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1f26; --panel: #242833; --fg: #e6e8ec; --mut: #98a2b3; --line: #353b48;
      --acc: #53b1fd; --acc-fg: #0b1220; --chip: #2b3040;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 12px/1.35 "Segoe UI", "Leelawadee UI", Tahoma, sans-serif; }
  header { position: sticky; top: 0; background: var(--bg); padding: 6px 8px 5px; border-bottom: 1px solid var(--line); z-index: 2; }
  .top { display: flex; align-items: baseline; gap: 6px; }
  h1 { font-size: 13px; margin: 0; white-space: nowrap; }
  .mut { color: var(--mut); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .help { margin-left: auto; color: var(--mut); cursor: help; font-size: 12px; }
  input[type=search], select { width: 100%; padding: 3px 5px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--fg); font: inherit; }
  .row { display: flex; gap: 4px; margin-top: 4px; }
  .row > * { min-width: 0; }
  #q { flex: 1.5; } #fam { flex: 1.2; } #size { flex: 0.8; }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
  .chips button { border: 1px solid var(--line); background: var(--chip); color: var(--fg); border-radius: 10px; padding: 0 8px; cursor: pointer; font: inherit; font-size: 11px; line-height: 18px; }
  .chips button.on { background: var(--acc); color: var(--acc-fg); border-color: var(--acc); }
  main { padding: 0 8px 10px; }
  h2 { font-size: 11px; margin: 8px 0 3px; color: var(--mut); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 4px; }
  .card { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 3px; cursor: pointer; display: flex; flex-direction: column; gap: 1px; }
  .card:hover { border-color: var(--acc); }
  .card img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; border-radius: 3px; }
  .card .n { font-size: 10.5px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .b { font-size: 9.5px; color: var(--acc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .b.free { color: var(--mut); }
  .empty { padding: 14px 0; color: var(--mut); }
</style>
</head>
<body>
<header>
  <div class="top"><h1>คลังอุปกรณ์จริง</h1><span class="mut" id="count"></span>
    <span class="help" id="help" title="">ⓘ</span></div>
  <div class="row">
    <input type="search" id="q" placeholder="ค้นหา: gate, บอล, PVC, JIS">
    <select id="fam"></select>
    <select id="size"></select>
  </div>
  <div class="chips" id="groups"></div>
</header>
<main id="list"></main>
<script>
const GROUPS = { all: 'ทั้งหมด', valves: 'วาล์ว', fittings: 'ข้อต่อ', flanges: 'หน้าแปลน', instruments: 'เครื่องวัด' };
const PP = {
  items: [], group: 'all',
  init(items) {
    this.items = items;
    document.getElementById('count').textContent = `${items.length} รายการ`;
    document.getElementById('help').title =
      'คัดลอก 1:1 จากไฟล์ตัวอย่าง · คลิกเลือก แล้วชี้ที่ท่อ\nวาล์ว/มิเตอร์ = บนท่อตรง · ข้องอ/ก๊อก/ฝาครอบ = ปลายท่อ · เกจ = บนท่อ\n' +
      'ขนาดปรับตามท่อที่ชี้ · เลือกขนาด = แสดงของที่ใช้กับท่อขนาดนั้นได้ (รวมรุ่นที่ขยายตามมาตรฐาน)';
    const fams = [...new Map(items.map(i => [i.family, i.family_name])).entries()];
    document.getElementById('fam').innerHTML = '<option value="">ทุกระบบ / วัสดุ</option>' +
      fams.map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
    const sizes = [...new Map(items.filter(i => i.size).map(i => [i.size, i.nps])).entries()].sort((a, b) => a[1] - b[1]);
    this.npsOf = Object.fromEntries(sizes);
    document.getElementById('size').innerHTML = '<option value="">ทุกขนาด</option>' +
      sizes.map(([s]) => `<option>${s}</option>`).join('');
    document.getElementById('groups').innerHTML = Object.entries(GROUPS)
      .map(([k, v]) => `<button data-g="${k}" class="${k === 'all' ? 'on' : ''}">${v}</button>`).join('');
    document.querySelectorAll('#groups button').forEach(b => b.onclick = () => {
      this.group = b.dataset.g;
      document.querySelectorAll('#groups button').forEach(x => x.classList.toggle('on', x === b));
      this.render();
    });
    ['q', 'fam', 'size'].forEach(id => document.getElementById(id).oninput = () => this.render());
    this.render();
  },
  // Does item i serve a pipe of the chosen size? Exact size, a gauge (one
  // size for all), a part made in standard sizes within its range, or the
  // largest real model of a valve that is scaled to standard dimensions.
  fits(i, size) {
    if (!size || i.size === size || i.any) return true;
    const n = this.npsOf[size] || 0;
    if (i.range) return n >= i.range[0] && n <= i.range[1];
    if (i.grow) return n > i.grow[0] && n <= i.grow[1];
    return false;
  },
  render() {
    const q = document.getElementById('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const fam = document.getElementById('fam').value, size = document.getElementById('size').value;
    const hits = this.items.filter(i =>
      (this.group === 'all' || i.group === this.group) && (!fam || i.family === fam) && this.fits(i, size) &&
      q.every(w => (i.name + ' ' + i.standard + ' ' + i.src).toLowerCase().includes(w)));
    const by = {};
    hits.forEach(i => (by[i.family_name] = by[i.family_name] || []).push(i));
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const card = (i) => {
      let name = i.name.split(' – ')[0], badge = i.snap, free = !i.snap.startsWith('สแนป') && !i.snap.startsWith('ติด');
      if (size && i.grow && i.size !== size) {
        name = name.replace(i.size, size);
        badge = `ขยายจาก ${i.size} ตามมาตรฐาน`;
      } else if (typeof i.sized === 'string') {
        badge += ' · ' + i.sized;
      }
      const tip = [i.name, i.standard, i.snap, i.src].filter(Boolean).join('\n');
      return `<div class="card" data-k="${esc(i.key)}" title="${esc(tip)}">` +
        `<img loading="lazy" src="../refs/thumbs/${i.thumb}.jpg" alt="">` +
        `<div class="n">${esc(name)}</div><div class="b${free ? ' free' : ''}">${esc(badge)}</div></div>`;
    };
    document.getElementById('list').innerHTML = hits.length ? Object.entries(by).map(([f, list]) =>
      `<h2>${esc(f)} (${list.length})</h2><div class="grid">` + list.map(card).join('') + '</div>').join('')
      : '<div class="empty">ไม่พบรายการ</div>';
    document.querySelectorAll('.card').forEach(c => c.onclick = () => sketchup.insert(c.dataset.k));
  }
};
window.PP = PP;
document.addEventListener('DOMContentLoaded', () => { if (window.sketchup) sketchup.ready(); });
</script>
</body>
</html>
