<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Sarabun';font-weight:400;src:url(fonts/Sarabun-400.ttf);}
@font-face{font-family:'Sarabun';font-weight:600;src:url(fonts/Sarabun-600.ttf);}
@font-face{font-family:'Sarabun';font-weight:700;src:url(fonts/Sarabun-700.ttf);}
@page { size: 148mm 210mm; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 148mm; height: 210mm; }
body { font-family: 'Sarabun', 'Loma', sans-serif; color: #1f2937; background: #fff;
  padding: 12mm 9mm; display: flex; flex-direction: column; justify-content: center; }
.head { border-left: 5px solid #0b5394; padding-left: 4mm; margin-bottom: 10mm; }
.head h1 { font-size: 22pt; font-weight: 700; color: #0b3d6e; line-height: 1.25; }
.head p { font-size: 11.5pt; color: #5b6b7d; margin-top: 1mm; }
table { width: 100%; border-collapse: collapse; font-size: 13pt; }
th, td { border: 1px solid #b9c7d6; text-align: center; vertical-align: middle; }
thead th { background: #0b5394; color: #fff; font-weight: 600; padding: 5mm 1.5mm; line-height: 1.3; font-size: 11pt; }
thead th small { display: block; font-weight: 400; font-size: 10pt; opacity: .85; }
tbody td { padding: 11mm 1.5mm; }
tbody tr:nth-child(even) td { background: #eef4fa; }
td.param { text-align: left; padding-left: 3mm; font-weight: 600; color: #0b3d6e; }
td.param small { display: block; font-weight: 400; color: #5b6b7d; font-size: 8.5pt; }
td.na { color: #8a97a6; font-size: 11.5pt; }
td.val { font-weight: 600; white-space: nowrap; }
col.c-param { width: 23%; } col.c-unit { width: 14%; } col.c-std { width: 20%; } col.c-a { width: 23%; } col.c-b { width: 20%; }
.note { margin-top: 6mm; font-size: 8.5pt; color: #5b6b7d; line-height: 1.5; }
</style></head><body>
<div class="head">
  <h1>มาตรฐานคุณภาพน้ำ</h1>
  <p>Water Quality Standard &amp; Limit of Design</p>
</div>
<table>
  <colgroup><col class="c-param"><col class="c-unit"><col class="c-std"><col class="c-a"><col class="c-b"></colgroup>
  <thead><tr>
    <th>Parameter</th>
    <th>Unit</th>
    <th>มาตรฐาน<br>น้ำประปา<br>ส่วนภูมิภาค</th>
    <th>Limit of<br>Design<small>(จุด A)</small></th>
    <th>Limit of<br>Design<small>(จุด B)</small></th>
  </tr></thead>
  <tbody>
    <tr><td class="param">pH</td><td>–</td><td class="val">6.5 – 8.5</td><td class="val">7.5 – 8.5</td><td class="val">6.5 – 7.5</td></tr>
    <tr><td class="param">Conductivity</td><td>µS/cm</td><td class="na">ไม่ได้ระบุ</td><td class="val">≤ 3,610.00</td><td class="na">ไม่ได้ระบุ</td></tr>
  </tbody>
</table>
</body></html>
